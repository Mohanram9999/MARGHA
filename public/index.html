<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marga</title>
<style>
:root{--bg:#0e1a2b;--bg2:#16304a;--ink:#eef4fb;--mute:#8fa6bf;--card:#1b3553;--mc:#7dffd4;--avatar-ratio:1/1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:radial-gradient(120% 70% at 50% 25%,var(--bg2),var(--bg))}
.m-happy{--mc:#7dffd4;--bg2:#16304a}.m-excited{--mc:#ffd36b;--bg2:#4a3a14}.m-caring{--mc:#ff9ec7;--bg2:#4a1d3a}.m-calm{--mc:#8fd0ff;--bg2:#14344f}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.5px}
h2{margin:0 0 4px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid #2c4c70;background:#12263d;color:var(--ink);display:grid;place-items:center;font-size:16px}
.stage{flex:0 0 46%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.avatar{width:min(42vw,180px);aspect-ratio:var(--avatar-ratio);border-radius:24px;overflow:hidden;position:relative;background:#0a1422;border:1px solid var(--mc);box-shadow:0 0 22px -6px var(--mc);transition:box-shadow .3s}
.avatar video{width:100%;height:100%;object-fit:cover;display:block}
.avatar .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;border:2px dashed #2c4c70;border-radius:22px;color:var(--mute);font-size:12px}
.avatar .ph b{color:var(--ink);font-size:15px}
.listening .avatar{animation:ring .7s ease-in-out infinite alternate}
.talking .avatar{animation:ring 1.1s ease-in-out infinite alternate}
.thinking .avatar{animation:ring 1.6s ease-in-out infinite alternate}
@keyframes ring{to{box-shadow:0 0 34px 2px var(--mc)}}
.chip{position:relative;z-index:2;pointer-events:none;font-size:12px;font-weight:700;color:var(--mc);border:1px solid var(--mc);border-radius:14px;padding:1px 12px;margin-top:8px}
.status{margin-top:6px;font-size:14px;color:var(--mute);text-align:center;padding:0 20px;position:relative;z-index:2;pointer-events:none;min-height:18px}
.loc{position:relative;z-index:2;margin-top:4px;background:none;border:1px solid #2c4c70;color:var(--mute);border-radius:14px;padding:3px 12px;font-size:12px}
.tap{position:absolute;inset:0;background:none;border:0;width:100%}
.bubble{position:relative;z-index:2;pointer-events:none;max-width:88%;margin-top:12px;padding:10px 14px;border-radius:18px;background:rgba(27,53,83,.95);border:1px solid var(--mc);font-size:15px;line-height:1.35;text-align:center;max-height:110px;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1),bob 3.5s ease-in-out .4s infinite}
.bubble:before{content:"";position:absolute;top:-7px;left:50%;margin-left:-6px;width:12px;height:12px;background:#1b3553;border-left:1px solid var(--mc);border-top:1px solid var(--mc);transform:rotate(45deg)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(14px)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble i,.dots i{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--mc);animation:dot 1s infinite}
.bubble i:nth-child(2),.dots i:nth-child(2){animation-delay:.15s}.bubble i:nth-child(3),.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-6px);opacity:.4}}
.ubub{position:absolute;right:12px;bottom:4px;z-index:3;pointer-events:none;max-width:60%;padding:8px 12px;border-radius:16px 16px 4px 16px;background:#1f5d63;font-size:14px;animation:flyup 2.8s ease-out forwards}
@keyframes flyup{0%{opacity:0;transform:translateY(20px) scale(.7)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-80px)}}
.bottom{flex:1;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));background:#0b1626;border-radius:26px 26px 0 0;border-top:1px solid #23415f}
.grab{width:44px;height:4px;background:#2c4c70;border-radius:2px;margin:6px auto 10px}
.hint{text-align:center;color:var(--mute);font-size:13px;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:9px 4px;border-radius:12px;border:1px solid #2c4c70;background:none;color:var(--mute);font-weight:600;font-size:13px}
.tab.on{color:#06231c;background:var(--mc);border-color:var(--mc)}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cc{flex:0 0 62%;max-width:240px;height:150px;border-radius:20px;border:2px solid transparent;scroll-snap-align:start;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:14px;text-align:left;background-size:cover;background-position:center;font-family:inherit}
.cc.on{border-color:var(--mc)}
.cc .big{position:absolute;top:10px;right:14px;font-size:52px;filter:drop-shadow(0 4px 8px #0006)}
.cc b{font-size:19px;text-shadow:0 2px 8px #0008}
.cc small{opacity:.85;font-size:12px}
.g-0{background-image:linear-gradient(135deg,#ff9a3c,#e8453c)}
.g-1{background-image:linear-gradient(135deg,#1fb6a6,#0f6f8f)}
.g-2{background-image:linear-gradient(135deg,#43c46b,#1c7a4a)}
.g-3{background-image:linear-gradient(135deg,#4f9dff,#6a4cff)}
.g-4{background-image:linear-gradient(135deg,#8a5cff,#3a2a9a)}
.g-5{background-image:linear-gradient(135deg,#ff6fb1,#a23cc2)}
.g-help{background-image:linear-gradient(135deg,#e5484d,#7a1230)}
.results{display:flex;flex-direction:column;gap:10px}
.res{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--card);border-left:4px solid var(--mc);animation:pop .4s backwards}
.res b{display:block;font-size:16px}
.res small{color:var(--mute);font-size:14px}
.res .row{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:14px}
.rimg{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;background:#0a1422}
.rimg.ico{display:grid;place-items:center;font-size:30px}
.rbody{flex:1;min-width:0}
.lnks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.lnk{color:var(--mc);font-weight:600;text-decoration:none;font-size:13px;border:1px solid var(--mc);border-radius:10px;padding:3px 9px;background:none;font-family:inherit}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:12px}
.hero{width:100%;height:150px;object-fit:cover;border-radius:16px;margin-bottom:10px}
.trip h2{font-size:20px}
.sum{margin:0 0 10px;color:var(--mute);font-size:14px;display:block}
.book{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.dayh{width:100%;display:flex;justify-content:space-between;padding:12px;border-radius:14px;border:1px solid #2c4c70;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;margin-top:8px;text-align:left}
.stop{margin-top:8px}
.tips{color:var(--mute);font-size:14px;padding-left:18px}
.leg{margin:6px 0 0 8px}
.route{margin:8px 0 0}
.tp,.acct{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px}
.tp h3{margin:0 0 6px;font-size:16px}
.tp input,.acct input{width:100%;margin:4px 0;padding:11px;border-radius:10px;border:1px solid #2c4c70;background:#0b1626;color:var(--ink);font-size:16px}
.go{width:100%;margin-top:6px;padding:12px;border-radius:12px;border:0;background:var(--mc);color:#06231c;font-weight:700;font-size:16px}
.amsg{margin-top:8px;color:#ffd36b;font-size:14px}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(88vw,380px);background:#102238;border-left:1px solid #2c4c70;transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:5}
.panel.open{transform:none}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:10px 12px;border-radius:14px;font-size:15px;line-height:1.35;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.m.u{align-self:flex-end;background:#1f5d63;border-bottom-right-radius:4px}.m.b{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.forget{margin:0 14px 4px;background:none;border:0;color:var(--mute);font-size:12px;text-decoration:underline;align-self:flex-start}
.pin{display:flex;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pin input{flex:1;padding:12px;border-radius:12px;border:1px solid #2c4c70;background:#0b1626;color:var(--ink);font-size:16px}
.pin button{padding:0 16px;border-radius:12px;border:0;background:var(--mc);color:#06231c;font-weight:700}
.splash{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(120% 80% at 50% 30%,var(--bg2),var(--bg));border:0;color:var(--ink);width:100%;transition:opacity .6s}
.splash.hide{opacity:0;pointer-events:none}
.splash h1{font-size:38px}
.splash p{margin:0;color:var(--mute);font-size:16px;animation:bob 2s ease-in-out infinite}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--mc) 45%,#0a1422);box-shadow:0 0 50px -6px var(--mc);animation:ring 1.4s ease-in-out infinite alternate}
#err{position:fixed;left:0;right:0;top:0;z-index:99;color:#ffb3b3;font:12px monospace;background:#200;padding:8px;white-space:pre-wrap;display:none}
@media (min-width:700px){body{display:flex;justify-content:center;background:#050b14}.app{width:430px;max-width:100%;border-left:1px solid #23415f;border-right:1px solid #23415f}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="err"></div>
<script>
window.addEventListener("error", function (e) {
  var d = document.getElementById("err");
  d.style.display = "block"; d.textContent = "Error: " + e.message;
});
</script>
<script src="/app.js"></script>
</body>
</html>
