<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marga</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--bg:#0e1a2b;--bg2:#16304a;--ink:#eef4fb;--mute:#8fa6bf;--amber:#ffb84d;--card:#1b3553;--mc:#7dffd4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:radial-gradient(120% 70% at 50% 25%,var(--bg2),var(--bg))}
.m-happy{--mc:#7dffd4;--bg2:#16304a}.m-excited{--mc:#ffd36b;--bg2:#4a3a14}.m-caring{--mc:#ff9ec7;--bg2:#4a1d3a}.m-calm{--mc:#8fd0ff;--bg2:#14344f}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.5px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid #2c4c70;background:#12263d;color:var(--ink);display:grid;place-items:center}
.stage{flex:0 0 50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.stage svg{width:min(52vw,220px);height:auto;overflow:visible}
.chip{position:relative;z-index:2;pointer-events:none;font-size:12px;font-weight:700;color:var(--mc);border:1px solid var(--mc);border-radius:14px;padding:1px 12px;margin-top:2px}
.status{margin-top:6px;font-size:14px;color:var(--mute);text-align:center;padding:0 20px;position:relative;z-index:2;pointer-events:none;min-height:18px}
.loc{position:relative;z-index:2;margin-top:6px;background:none;border:1px solid #2c4c70;color:var(--mute);border-radius:14px;padding:3px 12px;font-size:12px}
.tap{position:absolute;inset:0;background:none;border:0;width:100%}
.bubble{position:relative;z-index:2;pointer-events:none;max-width:88%;margin-top:12px;padding:10px 14px;border-radius:18px;background:rgba(27,53,83,.95);border:1px solid var(--mc);font-size:15px;line-height:1.35;text-align:center;max-height:132px;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1),bob 3.5s ease-in-out .4s infinite}
.bubble:before{content:"";position:absolute;top:-7px;left:50%;margin-left:-6px;width:12px;height:12px;background:#1b3553;border-left:1px solid var(--mc);border-top:1px solid var(--mc);transform:rotate(45deg)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(14px)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble i,.dots i{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--mc);animation:dot 1s infinite}
.bubble i:nth-child(2),.dots i:nth-child(2){animation-delay:.15s}.bubble i:nth-child(3),.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-6px);opacity:.4}}
.ubub{position:absolute;right:12px;bottom:4px;z-index:3;pointer-events:none;max-width:60%;padding:8px 12px;border-radius:16px 16px 4px 16px;background:#1f5d63;font-size:14px;animation:flyup 2.8s ease-out forwards}
@keyframes flyup{0%{opacity:0;transform:translateY(20px) scale(.7)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-80px)}}
.ufo{animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px)}}
.beam{opacity:0;transform-origin:50% 0}
.listening .beam{animation:flash .55s ease-in-out infinite alternate}
.thinking .beam{opacity:.35}
@keyframes flash{from{opacity:.15}to{opacity:.85}}
.listening .ufo{animation:hover 1s ease-in-out infinite}
.lights circle{animation:blink 1.6s steps(1) infinite}
.lights circle:nth-child(2){animation-delay:.5s}.lights circle:nth-child(3){animation-delay:1s}
@keyframes blink{50%{fill:#fff}}
.bot{transform-origin:50% 100%;animation:idle 4s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-3px)}}
.listening .bot,.m-excited.talking .bot{animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-8px) scale(1.03)}}
.listening .eye{animation:wide .5s infinite alternate}
@keyframes wide{to{transform:scaleY(1.35)}}
.m-caring .eye{transform:scaleY(.72)}
.thinking .antenna{animation:spin 1s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.eye,.mouth{transition:all .3s}
.mouth{transform-box:fill-box;transform-origin:center top}
.talk{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(1.7)}}
.bottom{flex:1;overflow-y:auto;scroll-snap-type:y proximity;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));background:#0b1626;border-radius:26px 26px 0 0;border-top:1px solid #23415f}
.grab{width:44px;height:4px;background:#2c4c70;border-radius:2px;margin:6px auto 12px}
.hint{text-align:center;color:var(--mute);font-size:13px;margin-bottom:10px}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:10px;scroll-snap-align:start}
.need{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;border:1px solid #2c4c70;background:var(--card);color:var(--ink);font-size:16px;font-weight:600;text-align:left}
.need span.e{font-size:22px}
.need.on{border-color:var(--mc);background:#14474a}
.need.help{grid-column:span 2;background:#4a2230;border-color:#9b4058}
.results{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.results h2{margin:0 0 2px;font-size:17px}
.res{padding:14px;border-radius:16px;background:var(--card);border-left:4px solid var(--mc);animation:pop .4s backwards}
.res b{display:block;font-size:16px}
.res small{color:var(--mute);font-size:14px}
.res .row{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:14px}
.res a{color:var(--mc);font-weight:600;text-decoration:none}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:12px}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(88vw,380px);background:#102238;border-left:1px solid #2c4c70;transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:5}
.panel.open{transform:none}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:10px 12px;border-radius:14px;font-size:15px;line-height:1.35;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.m.u{align-self:flex-end;background:#1f5d63;border-bottom-right-radius:4px}.m.b{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.pin{display:flex;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pin input{flex:1;padding:12px;border-radius:12px;border:1px solid #2c4c70;background:#0b1626;color:var(--ink);font-size:16px}
.pin button{padding:0 16px;border-radius:12px;border:0;background:var(--mc);color:#06231c;font-weight:700}
.splash{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(120% 80% at 50% 30%,var(--bg2),var(--bg));border:0;color:var(--ink);width:100%;transition:opacity .6s}
.splash.hide{opacity:0;pointer-events:none}
.splash svg{width:min(60vw,250px);height:auto}
.splash h1{font-size:38px}
.splash p{margin:0;color:var(--mute);font-size:16px;animation:bob 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"><p style="color:#8fa6bf;font:16px system-ui;padding:24px">Loading Marga… (the first load can take up to a minute)</p></div>
<script>
window.addEventListener("error",function(e){var r=document.getElementById("root");if(r&&r.children.length<2)r.innerHTML='<pre style="color:#ffb3b3;font:13px monospace;padding:16px;white-space:pre-wrap">Error: '+e.message+'</pre>';});
</script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const API_BASE = "";

const NEEDS = [
  { id: "eat", label: "Eat now", e: "🍽️" },
  { id: "restroom", label: "Restroom", e: "🚻" },
  { id: "atm", label: "ATM", e: "🏧" },
  { id: "pharmacy", label: "Pharmacy", e: "💊" },
  { id: "back", label: "Get back", e: "🧭" },
  { id: "events", label: "Events", e: "🎫" },
  { id: "help", label: "Help", e: "🆘" },
];

const MOOD = {
  happy:   { tag: "😊 Happy", pitch: 1.2, rate: 1.05, mouth: "M136 194 Q150 207 164 194", fill: false,
    open: ["Great choice!", "I love helping with this!"], close: ["Hope this makes your day better!", "Go enjoy it, you deserve it!"] },
  excited: { tag: "🤩 Excited", pitch: 1.4, rate: 1.12, mouth: "M131 191 Q150 219 169 191Z", fill: true,
    open: ["Oh yes, this is going to be so good!", "I'm so excited to help!"], close: ["Have an amazing time!", "Go get it, champion!"] },
  caring:  { tag: "🤗 Caring", pitch: 1.0, rate: 0.9, mouth: "M139 197 Q150 204 161 197", fill: false,
    open: ["I'm here with you. Take a deep breath.", "Don't worry, we'll sort this out together."], close: ["You're doing better than you think.", "Small steps count, and I'm cheering for you."] },
  calm:    { tag: "💙 Calm", pitch: 0.95, rate: 0.88, mouth: "M139 197 Q150 201 161 197", fill: false,
    open: ["Stay calm, I'm right here. You're not alone."], close: ["Please stay safe. If it is urgent, call your local emergency number."] },
};

const pick = a => a[Math.floor(Math.random() * a.length)];

function detectMood(text, need) {
  const t = (text || "").toLowerCase();
  if (need === "help" || /hurt|emergency|accident|pain|bleed|scared|danger|lost|police/.test(t)) return "calm";
  if (/tired|sad|stress|bad day|lonely|down|upset|angry|cry|worried|anxious|exhaust/.test(t)) return "caring";
  if (/hungry|starv|party|fun|celebrat|birthday|awesome|amazing|movie|concert|event/.test(t) || need === "eat" || need === "events") return "excited";
  return "happy";
}

function speak(text, mood) {
  return new Promise(resolve => {
    try {
      if (!window.speechSynthesis) return resolve();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = MOOD[mood].pitch; u.rate = MOOD[mood].rate;
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
      setTimeout(resolve, 20000);
    } catch (e) { resolve(); }
  });
}

async function askFeel(query, need, history) {
  try {
    const r = await Promise.race([
      fetch(API_BASE + "/api/feel", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, need, history }),
      }).then(x => x.json()),
      new Promise(res => setTimeout(() => res(null), 9000)),
    ]);
    return r && r.llm ? r : null;
  } catch (e) { return null; }
}

async function askMarga(query, need, pos, mood, search) {
  try {
    const r = await fetch(API_BASE + "/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, need, mood, search, lat: pos.lat, lng: pos.lng }),
    });
    if (!r.ok) throw new Error("bad status");
    const d = await r.json();
    return { reply: d.reply || "Here is what I found.", results: d.results || [], mood: d.mood, llm: !!d.llm };
  } catch (e) {
    return { reply: "I couldn't reach the server. Please try again in a moment.", results: [] };
  }
}

function Agent({ mode, mood }) {
  const M = MOOD[mood];
  const warm = mood !== "calm";
  return (
    <svg viewBox="0 0 300 330" aria-hidden="true">
      <defs>
        <linearGradient id="bm" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style={{ stopColor: "var(--mc)" }} stopOpacity=".9" />
          <stop offset="1" style={{ stopColor: "var(--mc)" }} stopOpacity="0" />
        </linearGradient>
        <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#c9d8e8" /><stop offset="1" stopColor="#6f88a3" />
        </linearGradient>
      </defs>
      <polygon className="beam" points="125,68 175,68 235,250 65,250" fill="url(#bm)" />
      <g className="ufo">
        <ellipse cx="150" cy="42" rx="26" ry="18" fill="#9fe8ff" opacity=".85" />
        <ellipse cx="150" cy="58" rx="62" ry="15" fill="url(#hull)" />
        <g className="lights" fill="#ffb84d">
          <circle cx="112" cy="60" r="4" /><circle cx="150" cy="64" r="4" /><circle cx="188" cy="60" r="4" />
        </g>
      </g>
      <g className="bot">
        <line x1="150" y1="138" x2="150" y2="122" stroke="#8fa6bf" strokeWidth="4" />
        <circle className="antenna" cx="150" cy="118" r="7" fill="var(--mc)" />
        <rect x="95" y="138" width="110" height="88" rx="30" fill="#dbe7f3" />
        <rect x="108" y="152" width="84" height="56" rx="20" fill="#0e1a2b" />
        <circle cx="118" cy="193" r="6" fill="#ff7aa8" opacity={warm ? 0.6 : 0} />
        <circle cx="182" cy="193" r="6" fill="#ff7aa8" opacity={warm ? 0.6 : 0} />
        <g style={{ fill: "var(--mc)" }}>
          <ellipse className="eye" cx="133" cy="174" rx="7" ry="9" style={{ transformBox: "fill-box", transformOrigin: "center" }} />
          <ellipse className="eye" cx="167" cy="174" rx="7" ry="9" style={{ transformBox: "fill-box", transformOrigin: "center" }} />
        </g>
        <path className={"mouth" + (mode === "talking" ? " talk" : "")} d={M.mouth}
          style={{ stroke: "var(--mc)", fill: M.fill ? "var(--mc)" : "none" }} strokeWidth="3" strokeLinecap="round" />
        <rect x="112" y="226" width="76" height="46" rx="16" fill="#b7c9dc" />
        <rect x="80" y="232" width="20" height="10" rx="5" fill="#b7c9dc" />
        <rect x="200" y="232" width="20" height="10" rx="5" fill="#b7c9dc" />
        <rect x="122" y="272" width="22" height="16" rx="6" fill="#8fa6bf" />
        <rect x="156" y="272" width="22" height="16" rx="6" fill="#8fa6bf" />
      </g>
    </svg>
  );
}

function App() {
  const [started, setStarted] = useState(false);
  const [mode, setMode] = useState("idle");
  const [mood, setMood] = useState("happy");
  const [status, setStatus] = useState("");
  const [bubble, setBubble] = useState("");
  const [ub, setUb] = useState(null);
  const [need, setNeed] = useState(null);
  const [results, setResults] = useState(null);
  const [loc, setLoc] = useState("finding");
  const [fxKey, setFxKey] = useState(0);
  const [chatOpen, setChatOpen] = useState(false);
  const [msgs, setMsgs] = useState([]);
  const [text, setText] = useState("");
  const recRef = useRef(null);
  const posRef = useRef(null);
  const histRef = useRef([]);
  const runRef = useRef(0);
  const bottomRef = useRef(null);
  const endRef = useRef(null);

  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); }, [msgs, chatOpen, mode]);

  const getPos = () => new Promise(res => {
    if (posRef.current && Date.now() - posRef.current.t < 300000) return res(posRef.current);
    if (!navigator.geolocation) { setLoc("off"); return res(null); }
    setLoc("finding");
    navigator.geolocation.getCurrentPosition(
      p => { posRef.current = { lat: p.coords.latitude, lng: p.coords.longitude, t: Date.now() }; setLoc("on"); res(posRef.current); },
      () => { setLoc("off"); res(null); },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 }
    );
  });

  useEffect(() => { getPos(); fetch(API_BASE + "/api/health").catch(() => {}); }, []);

  const say = (m, t) => {
    setMood(m); setMsgs(x => [...x, { r: "b", t }]); setBubble(t); setStatus("");
    setMode("talking"); setFxKey(k => k + 1);
    histRef.current.push({ role: "assistant", content: t });
    return speak(t, m);
  };

  const finish = (m, full, res) => {
    say(m, full);
    if (res) {
      setResults(res);
      setTimeout(() => bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth", block: "start" }), 150);
    }
    setTimeout(() => setMode("idle"), 3500);
  };

  // First tap: unlock speech, then greet like a friend
  const start = async () => {
    setStarted(true);
    try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {}
    const id = ++runRef.current;
    const h = new Date().getHours();
    const part = h < 5 ? "late at night" : h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
    setMode("thinking");
    const f = await askFeel("Hey Marga! The app just opened and it is " + part + ". Greet me like my close friend, ask how I'm doing, and ask what I need.", null, []);
    if (id !== runRef.current) return;
    const m = f && MOOD[f.mood] ? f.mood : "happy";
    const hello = f && f.say ? f.say : "Hey there, friend! I'm Marga, and I'm so happy you're here. How are you doing today? Tell me what you need, or just chat with me.";
    await say(m, hello);
    if (id !== runRef.current) return;
    setMode("idle");
    setStatus("Tap me to talk");
  };

  const run = async (query, needId) => {
    const id = ++runRef.current;
    setMsgs(x => [...x, { r: "u", t: query }]);
    setUb({ t: query, k: Date.now() });
    setBubble(""); setStatus("");
    let m = detectMood(query, needId);
    setMood(m); setMode("thinking");
    const posP = getPos();
    const hist = histRef.current.slice(-8);
    histRef.current.push({ role: "user", content: query });
    const f = await askFeel(query, needId, hist);
    if (id !== runRef.current) return;
    if (f && MOOD[f.mood]) m = f.mood;

    if (f && f.type === "chat" && !needId) {
      await say(m, f.say);
      if (id === runRef.current) setTimeout(() => setMode("idle"), 800);
      return;
    }
    const comfort = f && f.say ? f.say : pick(MOOD[m].open) + " Let me find that for you.";
    const spoke = say(m, comfort);
    const pos = await posP;
    if (!pos) {
      await spoke;
      return finish("caring", "I need your location to find things near you. Please allow location in your browser, then tap the location button and ask me again.", null);
    }
    const d = await askMarga(query, needId, pos, m, f && f.search);
    await spoke;
    if (id !== runRef.current) return;
    const fm = d.mood && MOOD[d.mood] ? d.mood : m;
    finish(fm, d.llm ? d.reply : d.reply + " " + pick(MOOD[fm].close), d.results);
  };

  const listen = () => {
    if (mode === "listening") { recRef.current && recRef.current.stop(); return; }
    runRef.current++;
    try { speechSynthesis.cancel(); } catch (e) {}
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setMode("idle"); setStatus("Voice isn't supported here. Use the labels below or the chat icon."); return; }
    const rec = new SR();
    rec.lang = "en-US"; rec.interimResults = true;
    let finalText = "";
    rec.onstart = () => { setMode("listening"); setBubble(""); setStatus("I'm listening…"); };
    rec.onresult = e => {
      finalText = Array.from(e.results).map(r => r[0].transcript).join(" ");
      setStatus("“" + finalText + "”");
    };
    rec.onerror = () => { setMode("idle"); setStatus("I couldn't hear that. Tap me and try again."); };
    rec.onend = () => { if (finalText) run(finalText, null); else setMode("idle"); };
    recRef.current = rec;
    rec.start();
  };

  const pickNeed = n => { setNeed(n.id); run(n.label, n.id); };
  const send = () => { const q = text.trim(); if (!q) return; setText(""); run(q, null); };
  const locText = loc === "on" ? "📍 Location on" : loc === "finding" ? "📍 Finding you…" : "📍 Tap to turn on location";

  return (
    <div className={"app m-" + mood + " " + mode}>
      <button className={"splash" + (started ? " hide" : "")} onClick={start} aria-label="Tap to meet Marga">
        <Agent mode="idle" mood="happy" />
        <h1>Marga</h1>
        <p>Tap to meet your friend</p>
      </button>

      <header>
        <h1>Marga</h1>
        <button className="iconbtn" aria-label="Open chat" onClick={() => setChatOpen(true)}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
        </button>
      </header>

      <section className="stage">
        <Agent mode={mode} mood={mood} />
        <div className="chip">{MOOD[mood].tag}</div>
        {mode === "thinking"
          ? <div className="bubble"><i /><i /><i /></div>
          : bubble ? <div className="bubble" key={fxKey}>{bubble}</div> : null}
        <div className="status" aria-live="polite">{status}</div>
        <button className="loc" onClick={getPos}>{locText}</button>
        {ub && <div className="ubub" key={ub.k}>{ub.t}</div>}
        <button className="tap" aria-label="Tap to speak" onClick={listen} />
      </section>

      <section className="bottom">
        <div className="grab" />
        <div className="hint">Swipe up for quick needs</div>
        <div className="needs">
          {NEEDS.map(n => (
            <button key={n.id} className={"need" + (n.id === "help" ? " help" : "") + (need === n.id ? " on" : "")} onClick={() => pickNeed(n)}>
              <span className="e">{n.e}</span>{n.label}
            </button>
          ))}
        </div>
        <div className="results" ref={bottomRef}>
          <h2>{results ? "Results" : ""}</h2>
          {results && results.length === 0 && <div className="empty">Nothing found nearby. Try another need.</div>}
          {results && results.map((r, i) => (
            <div className="res" key={i} style={{ animationDelay: (i * 0.08) + "s" }}>
              <b>{r.name}</b>
              <small>{r.detail}</small>
              <div className="row">
                <span>{r.distance}</span>
                {r.link ? <a href={r.link} target="_blank" rel="noopener">Directions</a> : null}
              </div>
            </div>
          ))}
        </div>
      </section>

      <aside className={"panel" + (chatOpen ? " open" : "")}>
        <div className="phead">
          <span>Chat with Marga</span>
          <button className="iconbtn" aria-label="Close chat" onClick={() => setChatOpen(false)}>✕</button>
        </div>
        <div className="msgs">
          {msgs.map((m, i) => <div key={i} className={"m " + m.r}>{m.t}</div>)}
          {mode === "thinking" && <div className="m b dots"><i /><i /><i /></div>}
          <div ref={endRef} />
        </div>
        <div className="pin">
          <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} placeholder="Ask me anything" />
          <button onClick={send}>Send</button>
        </div>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
